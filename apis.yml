name: Heard
description: 'Heard (Heard Technologies, Inc.) is the financial management platform built specifically
  for therapists and wellness practitioners in private practice. Founded in 2019 and based in Seattle,
  Washington, Heard pairs easy-to-use software with a dedicated human team to handle bookkeeping,
  taxes, payroll, and business banking in a single subscription, so licensed mental health and allied
  health clinicians can focus on their clients. Heard serves solo and single-owner group practices
  across the United States, from newer sole proprietors to established S corporations, and connects
  with tools practices already use such as SimplePractice, TherapyNotes, Headway, Jane App, Stripe,
  and Square. Heard exposes no public developer API; this API Evangelist profile captures the company
  identity, its public web properties, and the published llms.txt.'
